services:
  frontend:
    image: ghcr.io/ia-cad/iadas-frontend:${IADAS_VERSION:?Definir IADAS_VERSION}
    container_name: frontend
    ports:
      - "8002:8002"
    restart: unless-stopped
    networks:
      - webnet

  sparql-generator:
    image: ghcr.io/ia-cad/iadas-sparql-generator:${IADAS_VERSION:?Definir IADAS_VERSION}
    container_name: sparql-generator
    ports:
      - "8003:8003"
    restart: unless-stopped
    depends_on:
      fuseki-init:
        condition: service_completed_successfully
    networks:
      - webnet

  gateway:
    image: ghcr.io/ia-cad/iadas-gateway:${IADAS_VERSION:?Definir IADAS_VERSION}
    container_name: gateway
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: "${JWT_SECRET:?Definir JWT_SECRET}"
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH:?Definir ADMIN_PASSWORD_HASH}"
    restart: unless-stopped
    depends_on:
      - frontend
    networks:
      - webnet

  fuseki:
    image: stain/jena-fuseki
    container_name: fuseki
    ports:
      - "3030:3030"
    environment:
      - FUSEKI_DATASET=ds
      - ADMIN_PASSWORD=admin
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3030/$$/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks:
      - webnet

  fuseki-init:
    image: ghcr.io/ia-cad/iadas-fuseki-init:${IADAS_VERSION:?Definir IADAS_VERSION}
    container_name: fuseki-init
    depends_on:
      fuseki:
        condition: service_healthy
    restart: on-failure
    networks:
      - webnet

  database-service:
    image: ghcr.io/ia-cad/iadas-database-service:${IADAS_VERSION:?Definir IADAS_VERSION}
    container_name: database-service
    ports:
      - "8005:8005"
    environment:
      JWT_SECRET: "${JWT_SECRET:?Definir JWT_SECRET}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
