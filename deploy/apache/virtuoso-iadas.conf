<VirtualHost *:80>
    ServerName iadas.i3s.unice.fr
    RewriteEngine on

    #--- No access to the home page of Virtuoso, redirect to the sparql interface
    #ProxyPassMatch ^/$ !
    #RewriteRule "^/$" "http://%{SERVER_NAME}/sparql" [R=303,L]

    #Header set Access-Control-Allow-Origin *

    #--- Proxy anything to Virtuoso port 8890
    ProxyPass /iadas/sparql http://localhost:8890/sparql
    ProxyPassReverse /iadas/sparql http://localhost:8890/sparql
    ProxyPass /fct http://localhost:8890/fct
    ProxyPassReverse /fct http://localhost:8890/fct
    ProxyPass /describe http://localhost:8890/describe
    ProxyPassReverse /describe http://localhost:8890/describe
    ProxyPass /services/ http://localhost:8890/services/
    ProxyPassReverse /services/ http://localhost:8890/services/

    ProxyPass /iadas http://localhost:8000/
    ProxyPassReverse /iadas http://localhost:8000/

    ProxyPassMatch ^/(api/auth)$ http://127.0.0.1:8000/$1
    ProxyPass /api/ http://127.0.0.1:8003/api/
    ProxyPassReverse /api/ http://127.0.0.1:8003/api/
    ProxyPassMatch ^/(stats)$ http://127.0.0.1:8000/$1 
    #--- Forbid access to Conductor, only allowed through direct access to Virtuoso port 8890 which is not open on the internet
    <Location /conductor>
      Order deny,allow
      Deny from all
    </Location>

</VirtualHost>
