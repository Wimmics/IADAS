sportPracticeType:
  description: Individual or collective character of the sport. Assigned by sport_practice.yaml lookup — the LLM extracts
    the sport name; sportPracticeType is inferred algorithmically.
  canonical:
  - Individual sport
  - Team sport
  - Mixed sport
  - Dual sport
sportLevel:
  description: Level of the study participants. Controlled vocabulary (values present in the IADAS knowledge graph) — choose
    the single best match.
  canonical:
  - Amateur
  - Professional
  - Student
  definitions:
    Amateur: 'Non-professional practitioners not in an academic program. Includes club athletes, gym members, recreational
      or fitness participants. Key signal: ''amateur'', ''club'', ''gym'', ''recreational'', ''fitness'', ''non-professional''.'
    Professional: 'Athletes for whom sport is a primary occupation, or competing at elite/Olympic level with compensation.
      Key signal: ''professional'', ''elite'', ''national team'', ''Olympic'', ''paid''.'
    Student: 'Participants enrolled in an academic program (university, college, conservatory, sport school, dance academy)
      as their primary status. Key signal: ''students'', ''university'', ''college'', ''collegiate'', ''enrolled'', ''school'',
      ''conservatory''.'
