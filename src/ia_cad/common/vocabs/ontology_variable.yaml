hasCategory:
  description: Top-level IADAS ontological category for the dependent variable (V1_CLASS). Use the exact string — these map
    to the IADAS VD taxonomy root nodes.
  canonical:
  - DEAB
  - Intrapersonal factor related to DEAB
  - Interpersonal factor related to DEAB
  - Sociocultural factor related to DEAB
  - Other behaviors
  definitions:
    DEAB: 'Primary outcome domain — disordered eating and associated behaviors. Typical V1 concepts: eating disorders, disordered
      eating, body image, body dissatisfaction, body appreciation, dietary restraint, drive for thinness, orthorexia nervosa,
      anorexia nervosa, bulimia nervosa, binge eating, eating attitudes, weight/shape concerns, muscle dysmorphia, body checking,
      weight control behaviors, restrained eating, emotional eating.'
    Intrapersonal factor related to DEAB: 'Psychological characteristics internal to the individual. Typical V2 concepts:
      self-esteem, perfectionism, anxiety, depression, affect, mood, motivation, athletic identity, self-compassion, psychological
      flexibility, mindfulness, self-efficacy, coping strategies, ego orientation.'
    Interpersonal factor related to DEAB: 'Social interactions and relational dynamics influencing DEAB. Typical V2 concepts:
      fat talk, muscle talk, body talk, peer pressure, coach pressure, social comparison, appearance teasing, weight commentary,
      social support, appearance-related feedback.'
    Sociocultural factor related to DEAB: 'Cultural, media, and sport-environment influences on DEAB. Typical V2 concepts:
      thin ideal internalization, muscularity ideal internalization, media exposure, sport-specific weight norms, appearance
      norms, sociocultural pressures, aesthetic sport demands.'
    Other behaviors: 'Behavioral correlates not classified elsewhere. Typical concepts: physical activity level, exercise
      frequency, dietary habits, supplement use, weight management, training load, exercise dependence, alcohol use.'
